name: Build COLASANTO Android RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify permanent signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "Firma Android permanente non configurata. Leggi SETUP_FIRMA_ANDROID.txt"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev typescript

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Install COLASANTO native file saver
        run: |
          TARGET="android/app/src/main/java/it/colasanto/personalstudio"
          mkdir -p "$TARGET"
          cp android-native/MainActivity.java "$TARGET/MainActivity.java"
          cp android-native/ColasantoFilesPlugin.java "$TARGET/ColasantoFilesPlugin.java"

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Prepare permanent signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/colasanto-release.jks
          chmod 600 android/app/colasanto-release.jks

      - name: Configure release version and signing
        env:
          COLASANTO_KEYSTORE_FILE: colasanto-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COLASANTO_VERSION_CODE: ${{ github.run_number }}
          COLASANTO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: node scripts/patch-android-release.js

      - name: Build signed release APK and AAB
        env:
          COLASANTO_KEYSTORE_FILE: colasanto-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Prepare artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk COLASANTO_CLIENT_ANDROID.apk
          cp android/app/build/outputs/bundle/release/app-release.aab COLASANTO_CLIENT_ANDROID.aab

      - name: Upload Android release
        uses: actions/upload-artifact@v4
        with:
          name: COLASANTO_CLIENT_ANDROID_RELEASE
          path: |
            COLASANTO_CLIENT_ANDROID.apk
            COLASANTO_CLIENT_ANDROID.aab
          if-no-files-found: error
