name: Build COLASANTO Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk COLASANTO_CLIENT_ANDROID_TEST.apk

      - uses: actions/upload-artifact@v4
        with:
          name: COLASANTO_CLIENT_ANDROID_TEST
          path: COLASANTO_CLIENT_ANDROID_TEST.apk
          if-no-files-found: error
