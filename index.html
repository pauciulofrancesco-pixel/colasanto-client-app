ass="tabs"><button onclick="tab('agenda')">📅 Prenota</button><button onclick="tab('docs')">🩺 Certificato</button><button onclick="tab('sheet')">📋 La mia scheda</button></div><section id="agenda" class="card"><h3>Agenda e prenotazioni</h3><div class="msg"><b>Regola disdette:</b> puoi annullare senza perdere la seduta fino a 24 ore prima. Nelle 24 ore precedenti l'appuntamento la seduta resta scalata.</div><div id="sessionsInfo" class="msg hidden"></div><div style="display:flex;gap:8px"><button onclick="week(-1)">◀</button><button onclick="week(0)">Oggi</button><button onclick="week(1)">▶</button></div><div id="weekTitle"></div><div id="agendaBody"></div></section><section id="docs" class="card hidden"><h3>Invia certificato medico</h3><input id="certDate" type="date"><input id="certFile" type="file" accept="application/pdf,image/jpeg,image/png"><button class="green" onclick="uploadCert()">Invia certificato</button><div id="certMsg"></div></section><section id="sheet" class="card hidden"><h3>La mia scheda</h3><button onclick="loadSheet()">Aggiorna scheda</button><div id="sheetMsg"></div><div id="sheetBody" class="sheet"></div><button id="printBtn" class="hidden" onclick="window.print()">🖨️ Stampa / Salva PDF</button></section></div></div><script>const PROJECT='https://owczbpqzduwkbmcfxttv.supabase.co',KEY='sb_publishable_stqBBt3ComRqwp1qNEqMvw_QorqqRMz',REST=PROJECT+'/rest/v1/rpc/';const invite=new URLSearchParams(location.search).get('i')||localStorage.getItem('colasanto_invite')||'';if(invite)localStorage.setItem('colasanto_invite',invite);let session=localStorage.getItem('colasanto_session')||'',client=null,offset=0,deferredPrompt=null;async function rpc(name,args){const r=await fetch(REST+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.message||d.error||'Errore');return d}async function boot(){if(invite)try{await rpc('client_invite_open',{p_invite_token:invite})}catch{}if(session){try{const d=await rpc('client_agenda',{p_session:session,p_from:dateISO(new Date()),p_to:dateISO(addDays(new Date(),1))});showApp();renderWeek()}catch{session='';localStorage.removeItem('colasanto_session')}}if((matchMedia('(display-mode: standalone)').matches||navigator.standalone)&&session)markInstalled()}async function login(){try{const d=await rpc('client_login',{p_invite_token:invite,p_phone:phone.value,p_pin:pin.value});session=d.session_token;client=d.client;localStorage.setItem('colasanto_session',session);showApp();renderWeek();loadSheet()}catch(e){loginMsg.innerHTML='<div class="msg">'+e.message+'</div>'}}function showApp(){login.classList.add('hidden');app.classList.remove('hidden');hello.textContent='Ciao '+(client?.name||'');sub.textContent='COLASANTO Personal Studio';const rem=client?.remaining_sessions??client?.sessions_remaining??client?.sedute_residue??client?.remaining??null;if(rem!==null&&rem!==undefined){sessionsInfo.textContent='Sedute residue: '+rem;sessionsInfo.classList.remove('hidden')}else{sessionsInfo.classList.add('hidden')}}function tab(id){['agenda','docs','sheet'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='sheet')loadSheet()}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){const x=new Date(d);const n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));x.setHours(0,0,0,0);return x}function dateISO(d){return d.toISOString().slice(0,10)}function week(n){offset=n===0?0:offset+n;renderWeek()}const slots=['07:00-08:30','08:30-10:00','10:00-11:30','11:30-13:00','13:00-14:30','14:30-16:00','16:00-17:30','17:30-19:00','19:00-20:30','20:30-22:00'];async function renderWeek(){const m=addDays(monday(new Date()),offset*7),to=addDays(m,5);weekTitle.textContent='Settimana '+m.toLocaleDateString('it-IT')+' - '+to.toLocaleDateString('it-IT');let rows=[];try{rows=await rpc('client_agenda',{p_session:session,p_from:dateISO(m),p_to:dateISO(to)})}catch(e){agendaBody.innerHTML=e.message;return}agendaBody.innerHTML='';for(let di=0;di<6;di++){const d=addDays(m,di),ds=dateISO(d);const h=document.createElement('div');h.className='day';h.textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'2-digit'});agendaBody.appendChild(h);for(const sl of slots){const list=rows.filter(x=>x.booking_date===ds&&x.slot_time===sl);const box=document.createElement('div');box.className='slot'+(list.some(x=>x.mine)?' mine':'');const mineRow=list.find(x=>x.mine);const status=mineRow?'La tua prenotazione':(list.length?'Posti occupati: '+list.length:'Disponibile');box.innerHTML='<div class="slot-head"><strong>'+sl+'</strong><span>'+list.length+'/4</span></div><div class="who">'+status+'</div>';if(list.some(x=>x.mine)){const mine=list.find(x=>x.mine);const b=document.createElement('button');b.className='red';b.textContent='Annulla la mia prenotazione';b.onclick=async()=>{if(confirm('Annullare la prenotazione? Se mancano meno di 24 ore, la seduta resterà scalata.')){await rpc('client_cancel_booking',{p_session:session,p_booking_id:mine.id});renderWeek()}};box.appendChild(b)}else if(list.length<4){const ch=document.createElement('div');ch.className='choices';[['Sala','sala','purple'],['PT Giuseppe','giuseppe','red'],['PT Amedeo','amedeo','blue']].forEach(([lab,act,cl])=>{const b=document.createElement('button');b.className=cl;b.textContent=lab;b.onclick=async()=>{try{await rpc('client_book',{p_session:session,p_date:ds,p_slot:sl,p_activity:act});renderWeek()}catch(e){alert(e.message)}};ch.appendChild(b)});box.appendChild(ch)}agendaBody.appendChild(box)}}}async function fileB64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}async function uploadCert(){const f=certFile.files[0];if(!f){certMsg.textContent='Seleziona un file';return}if(f.size>5*1024*1024){certMsg.textContent='File troppo grande: massimo
