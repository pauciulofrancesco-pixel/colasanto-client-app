<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f1f1f"><meta name="referrer" content="no-referrer"><meta name="app-version" content="github-pages-24h-v2-logo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.jpg"><title>COLASANTO Personal Studio</title><style>:root{--bg:#f4f5f7;--card:#fff;--text:#222;--muted:#6b7280;--dark:#1f1f1f;--red:#dc3545;--blue:#1677ff;--purple:#7c3aed;--green:#20a464}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);padding:18px;text-align:center;position:sticky;top:0;z-index:5}header img{width:min(440px,92%);border-radius:12px}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #00000010}.hidden{display:none!important}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin:6px 0}button{border:0;background:var(--dark);color:white;font-weight:700}.green{background:var(--green)}.blue{background:var(--blue)}.purple{background:var(--purple)}.red{background:var(--red)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tabs button{font-size:14px}.day{font-weight:800;margin-top:14px}.slot{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.slot-head{display:flex;justify-content:space-between;gap:10px}.who{font-size:13px;color:var(--muted);margin-top:8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.choices button{font-size:12px;padding:9px 5px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;color:white;font-size:11px;margin:2px}.sala{background:var(--purple)}.giuseppe{background:var(--red)}.amedeo{background:var(--blue)}.mine{outline:2px solid var(--green)}.msg{padding:10px;border-radius:10px;background:#eef7ff;margin:8px 0}.install{background:#111827}.sheet{overflow:auto}.sheet table{border-collapse:collapse;width:100%}.sheet td,.sheet th{border:1px solid #ccc;padding:6px}@media(max-width:650px){.choices{grid-template-columns:1fr}.tabs{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><header><img src="logo-header.jpg" alt="COLASANTO Personal Studio"></header><div class="wrap"><div id="login" class="card"><h2>Area Cliente</h2><p>Accedi con il numero di telefono registrato in palestra e il tuo PIN personale.</p><input id="phone" type="tel" placeholder="Numero di telefono"><input id="pin" inputmode="numeric" placeholder="PIN"><button onclick="login()">Accedi</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="hello" style="margin:0"></h2><div id="sub" style="color:var(--muted);font-size:13px"></div></div></div><button id="installBtn" class="install hidden">📲 Installa app sul telefono</button></div><div class="tabs"><button onclick="tab('agenda')">📅 Prenota</button><button onclick="tab('docs')">🩺 Certificato</button><button onclick="tab('sheet')">📋 La mia scheda</button></div><section id="agenda" class="card"><h3>Agenda e prenotazioni</h3><div class="msg"><b>Regola disdette:</b> puoi annullare senza perdere la seduta fino a 24 ore prima. Nelle 24 ore precedenti l'appuntamento la seduta resta scalata.</div><div id="sessionsInfo" class="msg hidden"></div><div style="display:flex;gap:8px"><button onclick="week(-1)">◀</button><button onclick="week(0)">Oggi</button><button onclick="week(1)">▶</button></div><div id="weekTitle"></div><div id="agendaBody"></div></section><section id="docs" class="card hidden"><h3>Invia certificato medico</h3><input id="certDate" type="date"><input id="certFile" type="file" accept="application/pdf,image/jpeg,image/png"><button class="green" onclick="uploadCert()">Invia certificato</button><div id="certMsg"></div></section><section id="sheet" class="card hidden"><h3>La mia scheda</h3><button onclick="loadSheet()">Aggiorna scheda</button><div id="sheetMsg"></div><div id="sheetBody" class="sheet"></div><button id="printBtn" class="hidden" onclick="window.print()">🖨️ Stampa / Salva PDF</button></section></div></div><script>const PROJECT='https://owczbpqzduwkbmcfxttv.supabase.co',KEY='sb_publishable_stqBBt3ComRqwp1qNEqMvw_QorqqRMz',REST=PROJECT+'/rest/v1/rpc/';const invite=new URLSearchParams(location.search).get('i')||localStorage.getItem('colasanto_invite')||'';if(invite)localStorage.setItem('colasanto_invite',invite);let session=localStorage.getItem('colasanto_session')||'',client=null,offset=0,deferredPrompt=null;async function rpc(name,args){const r=await fetch(REST+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.message||d.error||'Errore');return d}async function boot(){if(invite)try{await rpc('client_invite_open',{p_invite_token:invite})}catch{}if(session){try{const d=await rpc('client_agenda',{p_session:session,p_from:dateISO(new Date()),p_to:dateISO(addDays(new Date(),1))});showApp();renderWeek()}catch{session='';localStorage.removeItem('colasanto_session')}}if((matchMedia('(display-mode: standalone)').matches||navigator.standalone)&&session)markInstalled()}async function login(){try{const d=await rpc('client_login',{p_invite_token:invite,p_phone:phone.value,p_pin:pin.value});session=d.session_token;client=d.client;localStorage.setItem('colasanto_session',session);showApp();renderWeek();loadSheet()}catch(e){loginMsg.innerHTML='<div class="msg">'+e.message+'</div>'}}function showApp(){login.classList.add('hidden');app.classList.remove('hidden');hello.textContent='Ciao '+(client?.name||'');sub.textContent='COLASANTO Personal Studio';const rem=client?.remaining_sessions??client?.sessions_remaining??client?.sedute_residue??client?.remaining??null;if(rem!==null&&rem!==undefined){sessionsInfo.textContent='Sedute residue: '+rem;sessionsInfo.classList.remove('hidden')}else{sessionsInfo.classList.add('hidden')}}function tab(id){['agenda','docs','sheet'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='sheet')loadSheet()}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){const x=new Date(d);const n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));x.setHours(0,0,0,0);return x}function dateISO(d){return d.toISOString().slice(0,10)}function week(n){offset=n===0?0:offset+n;renderWeek()}const slots=['07:00-08:30','08:30-10:00','10:00-11:30','11:30-13:00','13:00-14:30','14:30-16:00','16:00-17:30','17:30-19:00','19:00-20:30','20:30-22:00'];async function renderWeek(){const m=addDays(monday(new Date()),offset*7),to=addDays(m,5);weekTitle.textContent='Settimana '+m.toLocaleDateString('it-IT')+' - '+to.toLocaleDateString('it-IT');let rows=[];try{rows=await rpc('client_agenda',{p_session:session,p_from:dateISO(m),p_to:dateISO(to)})}catch(e){agendaBody.innerHTML=e.message;return}agendaBody.innerHTML='';for(let di=0;di<6;di++){const d=addDays(m,di),ds=dateISO(d);const h=document.createElement('div');h.className='day';h.textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'2-digit'});agendaBody.appendChild(h);for(const sl of slots){const list=rows.filter(x=>x.booking_date===ds&&x.slot_time===sl);const box=document.createElement('div');box.className='slot'+(list.some(x=>x.mine)?' mine':'');const mineRow=list.find(x=>x.mine);const status=mineRow?'La tua prenotazione':(list.length?'Posti occupati: '+list.length:'Disponibile');box.innerHTML='<div class="slot-head"><strong>'+sl+'</strong><span>'+list.length+'/4</span></div><div class="who">'+status+'</div>';if(list.some(x=>x.mine)){const mine=list.find(x=>x.mine);const b=document.createElement('button');b.className='red';b.textContent='Annulla la mia prenotazione';b.onclick=async()=>{if(confirm('Annullare la prenotazione? Se mancano meno di 24 ore, la seduta resterà scalata.')){await rpc('client_cancel_booking',{p_session:session,p_booking_id:mine.id});renderWeek()}};box.appendChild(b)}else if(list.length<4){const ch=document.createElement('div');ch.className='choices';[['Sala','sala','purple'],['PT Giuseppe','giuseppe','red'],['PT Amedeo','amedeo','blue']].forEach(([lab,act,cl])=>{const b=document.createElement('button');b.className=cl;b.textContent=lab;b.onclick=async()=>{try{await rpc('client_book',{p_session:session,p_date:ds,p_slot:sl,p_activity:act});renderWeek()}catch(e){alert(e.message)}};ch.appendChild(b)});box.appendChild(ch)}agendaBody.appendChild(box)}}}async function fileB64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}async function uploadCert(){const f=certFile.files[0];if(!f){certMsg.textContent='Seleziona un file';return}if(f.size>5*1024*1024){certMsg.textContent='File troppo grande: massimo 5 MB';return}try{certMsg.textContent='Invio in corso...';await rpc('client_upload_certificate',{p_session:session,p_file_name:f.name,p_mime_type:f.type,p_expires_on:certDate.value||null,p_base64:await fileB64(f)});certMsg.innerHTML='<div class="msg">Certificato inviato correttamente alla palestra.</div>';certFile.value=''}catch(e){certMsg.textContent=e.message}}async function loadSheet(){if(!session)return;try{const s=await rpc('client_latest_sheet',{p_session:session});if(!s){sheetMsg.innerHTML='<div class="msg">Nessuna scheda caricata al momento.</div>';sheetBody.innerHTML='';printBtn.classList.add('hidden');return}sheetMsg.innerHTML='<div class="msg">Scheda v'+s.version+' · aggiornata '+new Date(s.uploaded_at).toLocaleDateString('it-IT')+(s.is_new?' · <b>NUOVA</b>':'')+'</div>';sheetBody.innerHTML=s.html_content||'<p>Scheda disponibile come file.</p>';if(s.file_base64){const a=document.createElement('a');a.href='data:application/octet-stream;base64,'+s.file_base64;a.download=s.file_name||'scheda';a.textContent='⬇️ Scarica file originale';a.style.display='inline-block';a.style.margin='10px 0';sheetBody.prepend(a)}printBtn.classList.remove('hidden')}catch(e){sheetMsg.textContent=e.message}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.classList.remove('hidden')});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else alert('Dal menu del browser scegli “Aggiungi a schermata Home” o “Installa app”.')};window.addEventListener('appinstalled',markInstalled);async function markInstalled(){if(session)try{await rpc('client_mark_installed',{p_session:session})}catch{}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});boot();</script></body></html>
